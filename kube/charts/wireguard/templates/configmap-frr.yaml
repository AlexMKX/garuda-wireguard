{{- if .Values.ospf }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-{{ .Values.name }}-frr
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "wireguard.labels" . | nindent 4 }}
data:
  frr.conf: |
{{ include "wireguard.frrConf" . | indent 4 }}
  daemons: |
    ospfd=yes
    zebra=yes
{{- end }}
